  - "方案"
  - "设计"
  - "调研"
  - "分析"
  - "架构"
  - "优化"
  - "评估"
  - "报告"
  - "排查"
  - "对比"
  - "比较"
  - "重构"
  - "迁移"
  - "部署"
  - "安全"
  - "性能"
  - "原理"
  - "策略"
  - "框架"
  - "模式"
  - "最佳实践"
  - "可行性"
  - "技术选型"
  - "数据库设计"
  - "接口设计"
  - "系统设计"
  - "网络拓扑"
  - "监控"
  - "工作流"
  - "方法论"
  - "蒸馏"
  - "RAG"
  - "MCP"
  - "Agent"
  - "LLM"
  - "方案调研"
  - "实现方案"
  - "解决方案"
  - "建设方案"

# ============================================================
# 低价值关键词：用于惩罚（匹配多个会降低分数）
# ============================================================
low_value_keywords:
  - "拉取代码"
  - "提交代码"
  - "添加文件"
  - "删除文件"
  - "重命名"
  - "查看状态"
  - "git status"
  - "git pull"
  - "git push"
  - "git add"

# ============================================================
# 排除文件名模式：匹配的文件直接排除
# ============================================================
exclude_patterns:
  - "^开始$"
  - "^无标题$"
  - "^untitled$"
  - "^Terminal"
  - "^Review Code Changes"
  - "^拉取代码$"
  - "^提交暂存"
  - "^添加忽略文件$"
  - "^提交暂存区文件$"
  - "^提交暂存代码$"

# ============================================================
# 操作性语句模式：从内容中移除的 AI 过渡语句
# ============================================================
operational_patterns:
  # "让我" + 动词
  - "^让我[再也还先深入继续进一步]?\\s*\\S{1,4}"
  # "我来" + 动词
  - "^我来[帮为您创建实现编写修改更新安装配置添加删除替换修复优化处理解决部署运行使用调用执行提供给出生成整理总结帮助协助支持指导引导带领陪伴]?\\s*\\S{1,4}"
  # "我需要/我将" + 动作
  - "^我[需要将要].{0,6}[创建修改实现编写部署配置]"
  # "现在让我/现在我"
  - "^现在\\s*(让我|我[已还也]?).{0,6}"
  # "首先"
  - "^首先\\s*(让我|我|创建|修改|实现)"
  # "我已经" + 状态
  - "^我[已就].{0,4}(阅读|查看|了解|完成|基于|收集|足够的|足够的信息)"
  # "好的/明白了/收到"
  - "^好的[，,]?\\s*(我|让|现在)"
  - "^明白了"
  - "^收到"
  - "^了解了"
  - "^我.{0,2}(明白了|理解了|了解了)"
  # "找到了"
  - "^找到了.{0,20}"
  # "没有上下文"
  - "^没有.{0,6}(上下文|之前的)"
  # "抱歉/对不起"
  - "^抱歉"
  - "^对不起"
  - "^不好意思"
  # "根据要求"
  - "^根据.{0,6}(要求|需求|分析)"
  # "完成工作"
  - "^完成.{0,6}工作"
  - "^已完成.{0,6}(创建|修改)"
  # "使用技能"
  - "^我.{0,4}使用.{0,4}技能"
  - "^我将使用.{0,4}技能"
  - "^现在.{0,4}(执行|调用).{0,4}技能"
  # "为你生成/创建"
  - "^[我现].{0,4}为[你您].{0,4}(生成|创建|整理|总结)"
  # "接下来"
  - "^接下来"
  # "继续完成"
  - "^继续.{0,6}完成"
  # "我刚刚"
  - "^我刚刚"
  # "我直接使用"
  - "^我直接.{0,4}使用"
  - "^我.{0,4}重新.{0,4}使用"
  # "深入分析/查看"
  - "^.{0,2}(深入|进一步).{0,4}(分析|查看|搜索|读取)"
  # "查看更多/搜索更多/读取更多"
  - "^.{0,2}(查看|搜索|读取).{0,2}(更多|更)"
  # "帮助你/协助你" 等
  - "^我来.{0,2}(帮助|协助|支持|指导|引导|带领)你"
  - "^让我.{0,2}(帮助|协助|支持|指导|引导|带领)你"
  # "编写脚本/创建文件"
  - "^.{0,2}(编写|创建|写入|更新).{0,4}(脚本|文件|代码)"
  # "已经收集了足够的信息"
  - "^.{0,4}(收集了|足够的|足够的信息)"
  # "我注意到/我看到"
  - "^我.{0,2}(注意到|看到|理解)"
  # "分析来源"
  - "^分析来源"
  # "我需要先"
  - "^我需要先"
  # "让我先看一下"
  - "^让我先看"
  # "你可能在"
  - "^你可能在"
  # "从截图/从上下文"
  - "^从.{0,4}(截图|上下文|报告|文档|查询结果)"
  # "我已经完全理解"
  - "^我已经完全理解"
  # "现在我理解了"
  - "^现在我理解"
  # "你说得对"
  - "^你说得对"
  # "完成的工作"
  - "^完成的工作"
  # "不客气"
  - "^不客气"

# ============================================================
# 项目合并：将多个源目录合并为同一项目
# 格式：源目录名: 合并后的项目名
# ============================================================
project_merge:
  doc: liangxi

# ============================================================
# 输出设置
# ============================================================
output:
  # 最少内容行数（清洗后）
  min_content_lines: 5
  # 最少内容字符数（清洗后）
  min_content_chars: 50
  # 最大标签数
  max_tags: 8
  # 评分分类阈值
  thresholds:
    high: 6
    medium: 3.5
    low: 2

# ============================================================
# 深度提取设置（AI 会话模式）
# 注意：以下配置仅用于 AI IDE 手动提取时的输出约定，
#       distill.py 代码不直接读取这些值。
#       若需实现自动化深度提取，需在 scripts/ 中添加对应脚本。
# ============================================================
deep_extraction:
  # 是否启用深度提取
  enabled: true
  # 输出目录后缀（与原目录同级，命名为：原目录名 + 后缀）
  output_dir_suffix: "_extracted"
  # JSON 输出子目录
  json_dir: "json"
  # MD 输出子目录
  md_dir: "md"
  # 清单文件名（记录已处理文件）
  manifest_file: "manifest.json"
  # 触发词（中英文）
  triggers:
    - "深度提取"
    - "extract"
  # 提取的知识类别
  categories:
    - decisions       # 决策及原因
    - ideas           # 想法、建议、机会
    - questions       # 待解决问题
    - action_items    # 行动项（含负责人、截止日期）
    - concepts        # 关键技术/业务概念
    - terms           # 术语、缩写
    - lessons         # 经验教训
    - architecture    # 架构决策
  # 最低评分阈值（仅对高于此分数的文件进行深度提取）
  min_score_threshold: 6

