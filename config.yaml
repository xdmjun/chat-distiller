  - "^推荐你.{0,6}"
  - "^可以考虑.{0,6}"

  # ── 总结/概括 类 ──
  - "^[总归]?.{0,2}结[一起]?.{0,4}"
  - "^概括[起来地]?.{0,4}"
  - "^总结一下"
  - "^总的来说"
  - "^总体来看"
  - "^综上所述"
  - "^总而言之"
  - "^简而言之"
  - "^简单来说"
  - "^简而言之"
  - "^一句话总结"

  # ── 示例/例子 类 ──
  - "^举[个个]例子"
  - "^例如[，,]"
  - "^比如说[，,]"
  - "^举个例子"
  - "^以下是个例子"

  # ── 开始/启动 类 ──
  - "^开始[吧了]"
  - "^让我们开始"
  - "^那我们开始"
  - "^我们开始[吧了]"

  # ── 看代码/阅读代码 类 ──
  - "^先看.{0,6}代码"
  - "^读.{0,4}(代码|文件|源码)"
  - "^看.{0,4}(代码|文件|源码|代码)"
  - "^阅读.{0,4}(代码|文件|源码)"
  - "^检视.{0,4}(代码|文件|源码)"

  # ── 我想/我认为 类 ──
  - "^我想.{0,6}可以"
  - "^我认为.{0,6}"
  - "^我觉得.{0,6}"
  - "^在我看来.{0,6}"

  # ── 这里/这是 类 ──
  - "^以下是.{0,6}"
  - "^这是.{0,6}(我|一个|为)"
  - "^这里[是].{0,6}"
  - "^这[就]?是.{0,6}(我|您|你)"
  - "^这里有几个.{0,6}"

  # ── 重新表述/换句话说 类 ──
  - "^换句话说"
  - "^换句话讲"
  - "^也就是说"
  - "^具体[来地]说"
  - "^更准确地说"
