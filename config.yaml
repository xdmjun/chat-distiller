# Chat Distiller 配置文件
# 修改此文件即可调整蒸馏规则，无需修改代码

# ============================================================
# 白名单规则：基于内容特征识别有价值文件
# 每条规则包含：
#   name: 规则名称
#   description: 规则描述
#   patterns: 正则表达式列表
#   match_type: "any"（匹配任一）或 "all"（匹配全部）
#   score: 匹配时加的分数
#   max_score: 该规则的最大贡献分数
# ============================================================
whitelist_rules:
  - name: "config_content"
    description: "包含有价值的代码配置（配置/设置/环境变量等）"
    patterns:
      - "(?:配置|设置|参数|环境变量|env|config|settings|yaml|json|toml)\\s*[:=：]"
      - "(?:host|port|password|key|secret|token|url|path)\\s*[:=：]"
      - "docker-compose|Dockerfile|nginx\\.conf|\\.env\\b"
      - "pip install|npm install|yarn add|apt-get|brew install"
    match_type: "any"
    min_matches: 2
    score: 1
    max_score: 1

  - name: "diagnosis_content"
    description: "包含问题诊断/排查类内容"
    patterns:
      - "(?:错误|报错|异常|失败|问题|原因|解决|修复|排查|定位)"
      - "(?:error|exception|failed|issue|problem|fix|debug|troubleshoot)"
      - "```(?:error|bash|shell|log|traceback)"
      - "原因.{0,20}(?:是|如下|分析)"
      - "解决方案|解决方法|修复方案"
    match_type: "any"
    min_matches: 2
    score: 1
    max_score: 1

  - name: "decision_content"
    description: "包含决策/对比分析内容"
    patterns:
      - "(?:对比|比较|优缺点|利弊|权衡|trade.?off|pros?.?\\s*cons?)"
      - "(?:方案[一二三四五]|选项[ABC]|方案[A-Z])"
      - "(?:推荐|建议|选择|决定|结论)"
      - "(?:优点|缺点|优势|劣势|风险)"
      - "(?:步骤[一二三四五\\d]|第[一二三四五\\d]步)"
    match_type: "any"
    min_matches: 2
    score: 1
    max_score: 1

  - name: "data_content"
    description: "包含数据/统计类内容（清单、列表、统计）"
    patterns:
      - "(?:统计|清单|列表|汇总|总览|概览|报告)"
      - "\\d+\\.\\s+\\S+"
      - "(?:共|总计|合计|数量|数目).*\\d+"
      - "(?:服务器|数据库|域名|IP|端口|接口).*\\d+"
    match_type: "any"
    min_matches: 2
    score: 0.5
    max_score: 0.5

  - name: "api_design"
    description: "API 设计相关内容"
    patterns:
      - "(?:REST|GraphQL|gRPC|API).*(?:设计|接口)"
      - "(?:接口|端点|endpoint).*(?:设计|定义|文档)"
      - "(?:请求|响应|request|response).*(?:参数|格式|结构)"
      - "HTTP\\s+(?:GET|POST|PUT|DELETE|PATCH)"
    match_type: "any"
    min_matches: 2
    score: 1
    max_score: 1

  - name: "architecture_content"
    description: "架构设计相关内容"
    patterns:
      - "(?:架构|系统设计|技术选型|技术栈)"
      - "(?:微服务|单体|分布式|集群|高可用)"
      - "(?:前端|后端|数据库|缓存|消息队列)"
      - "(?:设计模式|架构模式|MVC|MVVM|DDD)"
    match_type: "any"
    min_matches: 2
    score: 1
    max_score: 1

  - name: "devops_content"
    description: "DevOps/运维相关内容"
    patterns:
      - "(?:部署|上线|发布|回滚|灰度)"
      - "(?:CI/CD|持续集成|持续部署|Jenkins|GitHub Actions)"
      - "(?:监控|告警|日志|链路追踪|APM)"
      - "(?:容器|Docker|Kubernetes|K8s)"
    match_type: "any"
    min_matches: 2
    score: 1
    max_score: 1

  - name: "security_content"
    description: "安全相关内容"
    patterns:
      - "(?:安全|漏洞|攻击|防护|加密)"
      - "(?:XSS|CSRF|SQL注入|SSRF|RCE)"
      - "(?:认证|授权|鉴权|OAuth|JWT)"
      - "(?:HTTPS|SSL|TLS|证书)"
    match_type: "any"
    min_matches: 2
    score: 1
    max_score: 1

  - name: "performance_content"
    description: "性能优化相关内容"
    patterns:
      - "(?:性能|优化|瓶颈|延迟|吞吐量)"
      - "(?:缓存|索引|分页|懒加载|预加载)"
      - "(?:并发|并行|异步|多线程|协程)"
      - "(?:QPS|TPS|响应时间|RT|P99)"
    match_type: "any"
    min_matches: 2
    score: 1
    max_score: 1

  - name: "database_content"
    description: "数据库相关内容"
    patterns:
      - "(?:SQL|查询|索引|表结构|Schema)"
      - "(?:MySQL|PostgreSQL|MongoDB|Redis|Elasticsearch)"
      - "(?:事务|锁|MVCC|主从|读写分离)"
      - "(?:迁移|备份|恢复|分库分表)"
    match_type: "any"
    min_matches: 2
    score: 1
    max_score: 1

  - name: "ai_ml_content"
    description: "AI/机器学习相关内容"
    patterns:
      - "(?:LLM|大模型|大语言模型|GPT|Claude)"
      - "(?:RAG|检索增强|向量数据库|Embedding)"
      - "(?:Agent|智能体|工具调用|Function Calling)"
      - "(?:微调|Fine-tuning|LoRA|PEFT)"
      - "(?:Prompt|提示词|提示工程|Chain of Thought)"
    match_type: "any"
    min_matches: 2
    score: 1.5
    max_score: 1.5

# ============================================================
# 高价值关键词：用于标题和内容匹配
# ============================================================
