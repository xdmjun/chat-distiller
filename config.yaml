  - "^已更新.{0,6}"
  - "^已修改.{0,6}"

# ============================================================
# 英文套话模式：从内容中移除的 AI 过渡语句（50+ 条）
# ============================================================
english_platitudes:
  # "Let me" expressions
  - "(?i)^(Let me|Let's|Lemme)\\s+(start|begin|check|look|see|try|help|assist|guide|show|explain|clarify|verify|confirm|review|examine|analyze|think|consider|take|make|give|provide|create|build|write|implement|update|fix|resolve|solve|search|find|read|get|gather|collect)"
  - "(?i)^Let me\\s+(just|first|quickly|briefly|start|begin)"
  - "(?i)^Let's\\s+(first|start|begin|try|see|check|look)"
  - "(?i)^Lemme\\s+"

  # "I'll / I will" expressions
  - "(?i)^I['']?ll\\s+(start|begin|check|look|try|help|assist|guide|show|explain|clarify|verify|confirm|review|examine|analyze|think|consider|take|make|give|provide|create|build|write|implement|update|fix|resolve|search|find|gather|collect|walk|break|outline|summarize)"
  - "(?i)^I will\\s+(start|begin|check|look|try|help|assist|guide|show|explain|clarify|verify|confirm|review|examine|analyze|think|consider|take|make|give|provide|create|write|implement|update|fix|search)"
  - "(?i)^I['']?ll\\s+(be|go|do|work)"

  # "I need / I have to" expressions
  - "(?i)^I need\\s+(to|a|some|more|the|your)"
  - "(?i)^I (need|must|have to|wanna|want to|would like to)\\s+(first|start|begin|check|look|read|see|understand|get|gather|collect|find)"
  - "(?i)^I need\\s+(more context|more information|more details|to understand|to check|to verify)"

  # "I have / I've" expressions
  - "(?i)^I['']?ve\\s+(read|checked|looked|seen|reviewed|examined|analyzed|gathered|collected|found|understood|prepared|completed|finished)"
  - "(?i)^I have\\s+(read|checked|looked|seen|reviewed|examined|gathered|found|understood)"

  # "I think / I believe / I'd" expressions
  - "(?i)^I (think|believe|feel|guess|suppose|would|can|could|will|shall|may|might)\\s+"
  - "(?i)^I['']?d\\s+(like|recommend|suggest|say|think|start|begin|check|look|try|help|be)"

  # "Now / Next / First" temporal
  - "(?i)^Now[,]?\\s+(I|let|we|the|that|this|it)"
  - "(?i)^Now\\s+(that|then|what)"
  - "(?i)^Next[,]?\\s+(I|let|we|the|I['']ll|step)"
  - "(?i)^(First|Firstly|First of all)[,]?\\s+(let|I|we|the)"
  - "(?i)^(Then|After that|Afterwards)[,]?\\s+(I|we|let|the)"

  # "Okay / Alright / Well / So" fillers
  - "(?i)^(Okay|Ok|OK|Alright|All right)[,.]?\\s+(I|let|now|here|so|then|the|we)"
  - "(?i)^(So|Well)[,.]?\\s+(I|let|now|here|the|what|first)"
  - "(?i)^Alright[,]?\\s+(then|let|I)"

  # "I can see / I notice / I understand"
  - "(?i)^I (can|can see|notice|note|understand|see|realize|appreciate)\\s+(that|the|your|from|based)"
  - "(?i)^(From|Based on|Looking at)\\s+(the|your|this|these|that|what)"
  - "(?i)^I\\s+(see|understand|get|follow)[,.]?\\s+(what|why|how|that|you)"

  # "Based on / According to" rationalizers
  - "(?i)^Based\\s+on\\s+(the|your|this|my|our|what|that)"
  - "(?i)^According\\s+to\\s+(the|your|this|what)"
  - "(?i)^(Reviewing|Analyzing|Examining|Checking|Looking at)\\s+(the|your|this|these|my)"

  # "Here / This / That" pointers
  - "(?i)^Here['']?s\\s+(the|my|what|a|an|how|is|are|we)"
  - "(?i)^Here\\s+(is|are|we|I|goes)"
  - "(?i)^This\\s+(is|was|has|will|should|could|would)"

  # "Thank you / You're welcome" politeness
  - "(?i)^(Thank you|Thanks|Thx)[,.]?\\s+(for|!|$)"
  - "(?i)^(You['']?re welcome|No problem|Happy to help|Glad to help|Anytime)[,.]?\\s*"
  - "(?i)^(I hope|Hopefully)\\s+(this|that|it|the)"
  - "(?i)^(Feel free|Don['']?t hesitate)\\s+(to|reaching|asking)"
  - "(?i)^(If|Should) you\\s+(have|need|want|require|find)"

  # "To complete / In order to / To help you" purpose clauses
  - "(?i)^(To|In order to|To help you|To get started|To begin)\\s+"
  - "(?i)^(As requested|As you asked|Per your request),?\\s"

  # "I've gathered / I've collected" info-gathering
  - "(?i)^(With|Now that|Since|Given|Using|Using the)\\s+(this|these|that|all|the|enough|sufficient)"
  - "(?i)^(With|Armed with|Having|Now having)\\s+(this|the|enough|sufficient|all)"

  # "In summary / To summarize / In conclusion" conclusion fillers
  - "(?i)^(In summary|To summarize|In conclusion|To conclude|To sum up|Summing up)[,.]?\\s*"
  - "(?i)^(The|My|Our)\\s+(recommendation|suggestion|conclusion|advice)\\s+(is|would be)"

  # "As you can see / As shown above" presentation fillers
  - "(?i)^As\\s+(you can|we can|shown|mentioned|discussed|stated|noted|described)\\s+"
  - "(?i)^(Above|Below)\\s+(is|are|you['']ll|you can|we)"

  # "Let's summarize / Let me wrap up" wrap-up phrases
  - "(?i)^Let['']?s\\s+(summarize|wrap|recap|review|quickly|move)"
  - "(?i)^(Quickly|Briefly|Rapidly)\\s+(let|I|we)"

  # Miscellaneous common platitudes
  - "(?i)^That['']?s\\s+(a|an|the|great|good|excellent|correct|right|an interesting)"
  - "(?i)^This\\s+is\\s+(a|an|the|great|good|correct|right|interesting|important)"
  - "(?i)^Great\\s+(question|point|idea|suggestion)"
  - "(?i)^You['']?re\\s+(right|correct|absolutely right|on the right track|asking)"
  - "(?i)^Excellent\\s+(question|point|idea)"

# ============================================================
# 项目合并：将多个源目录合并为同一项目
# 格式：源目录名: 合并后的项目名
# ============================================================
project_merge:
  doc: liangxi

# ============================================================
# 输出设置
# ============================================================
output:
  # 最少内容行数（清洗后）
  min_content_lines: 5
  # 最少内容字符数（清洗后）
  min_content_chars: 50
  # 最大标签数
  max_tags: 8
  # 评分分类阈值
  thresholds:
    high: 6
    medium: 3.5
    low: 2

# ============================================================
# 深度提取设置（AI 会话模式）
# 注意：以下配置仅用于 AI IDE 手动提取时的输出约定，
#       distill.py 代码不直接读取这些值。
#       若需实现自动化深度提取，需在 scripts/ 中添加对应脚本。
# ============================================================
deep_extraction:
  # 是否启用深度提取
  enabled: true
  # 输出目录后缀（与原目录同级，命名为：原目录名 + 后缀）
  output_dir_suffix: "_extracted"
  # JSON 输出子目录
  json_dir: "json"
  # MD 输出子目录
  md_dir: "md"
  # 清单文件名（记录已处理文件）
  manifest_file: "manifest.json"
  # 触发词（中英文）
  triggers:
    - "深度提取"
    - "extract"
  # 提取的知识类别
  categories:
    - decisions       # 决策及原因
    - ideas           # 想法、建议、机会
    - questions       # 待解决问题
    - action_items    # 行动项（含负责人、截止日期）
    - concepts        # 关键技术/业务概念
    - terms           # 术语、缩写
    - lessons         # 经验教训
    - architecture    # 架构决策
  # 最低评分阈值（仅对高于此分数的文件进行深度提取）
  min_score_threshold: 6

