  - "^让我确认.{0,6}"
  - "^clarify一下.{0,6}"
  - "^让我澄清.{0,6}"

  # ── 其他常见 AI 过渡语 类 ──
  - "^您.{0,4}可以.{0,6}"
  - "^你可以.{0,4}(参考|查看|使用|尝试|考虑|修改)"
