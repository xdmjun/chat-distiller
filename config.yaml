  - "建设方案"

# ============================================================
# 低价值关键词：用于惩罚（匹配多个会降低分数）
# ============================================================
low_value_keywords:
  - "拉取代码"
  - "提交代码"
  - "添加文件"
  - "删除文件"
  - "重命名"
  - "查看状态"
  - "git status"
  - "git pull"
  - "git push"
  - "git add"

# ============================================================
# 排除文件名模式：匹配的文件直接排除
# ============================================================
exclude_patterns:
  - "^开始$"
  - "^无标题$"
  - "^untitled$"
  - "^Terminal"
  - "^Review Code Changes"
  - "^拉取代码$"
  - "^提交暂存"
  - "^添加忽略文件$"
  - "^提交暂存区文件$"
  - "^提交暂存代码$"

